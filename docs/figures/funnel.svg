<text x="40" y="562" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">Precision is N5/N3. N5 is execution-supported confirmation: the shipped artefact's own code ran under the oracle (environment repair such as shims permitted, code unmodified).</text>
<text x="40" y="581" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#767676" text-anchor="start">Each percentage is a within-frame ratio of this study's sampling frame, not a registry-wide rate.</text>
<text x="40" y="600" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#767676" text-anchor="start">The three frames are drawn side by side for layout and are NOT compared: they are different sampling frames, and no cross-ecosystem rate follows from them.</text>
